name: Build

# 为什么有这份 workflow：项目对外承诺「目标平台至少 Windows 和 macOS」，
# 但在此之前**没有任何 CI 在编译这个应用**。后果是 Windows 那条路
# 从写下那天起就没被编译过一次——`#[cfg(windows)]` 的 FFI（取工作区、
# 光标位置、显示器 DPI）长期只存在于源码里，从未被编译器看过一眼。
#
# 这类「看着像实现了、其实从没验证过」的代码，正是本项目反复栽跟头的那一类
# （见 CHANGELOG v0.0.266：发版链三处潜伏缺陷全都藏在「没跑过的代码」里）。
#
# ⚠️ **Windows 这次是真跑测试，不是只做编译。**
# 第一次跑很可能是红的——那就让它红着。CI 的作用是把「我们以为成立」变成
# 「已经验过」，而在此之前 Windows 上的任何结论都只是推断。
# 如果为了让徽章变绿而只做 `cargo check`，那等于造一个假的保证。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      # 可选：仓库变量 AGENTISLAND_SCAN_USER = 开发者本机用户名。
      # 不配时 scripts/scan-secrets.sh 会显式停用 username/local_user_path 两条身份
      # 规则并说明原因——runner 的 $USER 是通用账号名 `runner`，拿它当敏感词会命中
      # 源码里正常的英文词（实测 287 条），整条 macOS job 卡在扫描、后面的门禁与
      # 打包一条都跑不到。配了才会恢复这两条规则的判别力（脚本支持 SCAN_USER 覆盖）。
      SCAN_USER: ${{ vars.AGENTISLAND_SCAN_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: 编译检查
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装锁定的浏览器运行时
        run: |
          npm ci
          npx --no-install playwright install chromium
      - name: 脱敏扫描（工作区）
        # 红线不只在本机守：推送上去的内容必须同样过闸，否则一次绕过本地扫描的
        # 提交就能把密钥送进 git 对象。
        run: bash scripts/scan-secrets.sh
      - name: 统一源码、浏览器及框架门禁
        run: python3 scripts/automation/pipeline.py --profile ci --check-timeout 1800
      - name: 安装固定版本的 Tauri 打包工具
        run: cargo install tauri-cli --version 2.11.2 --locked
      - name: 构建并验证 ad-hoc 签名包
        # 同轮 ci 已运行 Rust 回归；这里验证真实打包、签名与内容收据。
        #
        # 为什么显式指定 SDK（actions/runner-images#14940，2026-10 起）：
        # macos-latest 当前是 macos-26-arm64 镜像，装了 **CLT 27.0 SDK**，但默认
        # 工具链仍是 Xcode 26.6——Xcode 的 ld 读不了 SDK 27 的 tbd 存根
        # （`unknown architecture arm64e.x1-macos`），任何链接都失败。这不是本仓
        # 代码的问题，也不是 build-app.sh 的选 SDK 逻辑错：它按设计选「本机最新
        # CLT SDK」，在工具链配套的真机上是对的。CI 里改用默认 Xcode 自带 SDK
        # （与 ld 同源）构建；CI 产物不分发，不涉及发布构建对最新 SDK 的要求。
        env:
          SKIP_TESTS: '1'
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "CI 构建 SDK: $SDKROOT"
          case "$SDKROOT" in
            */CommandLineTools/SDKs/MacOSX27*)
              echo "::error::runner 仍解析到 CLT 27 SDK（actions/runner-images#14940），与默认 ld 不配套" >&2
              exit 1
              ;;
          esac
          bash scripts/build-app.sh
      - name: 同包 CLI 与构建身份验收
        run: python3 scripts/automation/pipeline.py --profile package
      - name: 汇总执行结果
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          reports = sorted(Path('.scratch/automation-runs').glob('*/summary.md'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              for report in reports:
                  output.write(report.read_text(encoding='utf-8'))
                  output.write('\n')
          PY
      - name: 保存本轮测试证据（包括失败与未验项）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci-evidence
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .scratch/automation-runs/**/run.json
            .scratch/automation-runs/**/junit.xml
            .scratch/automation-runs/**/summary.md

  windows:
    name: Windows（已知编不过，持续观察）
    runs-on: windows-latest
    # ⚠️ **故意 `continue-on-error`。**
    #
    # v0.0.324 实测（run 38573012399，`--log-failed` 逐条解析）：
    # **12 个编译错误 / 8 个项目文件**（外加 vendor/tao 的 macOS 专用代码）——
    #   6 个 `std::os::unix` / POSIX libc（`SIGKILL`/`getppid`/`gethostname`/
    #      `PermissionsExt::from_mode` / `localtime_r`），
    #   6 个 **cfg 作用域**：item 被 `#[cfg(unix)]` 或 `#[cfg(not(windows))]`
    #      排除，调用方却没有对应门控。
    # macOS 侧同一份代码 1020 条测试全绿。
    #
    # v0.0.325 起这 12 个都已处理（placement 的 4 个错门控、cleaner 的
    # getppid/SIGKILL 平台分支、webhook 的 from_mode 门控、smtp 的
    # GetComputerNameW 实现）。但**没有一个经过真实 Windows 编译器验证**：
    # 本机交叉编译被 `rusqlite` 的 bundled C 挡住，只能靠
    # `scripts/check-windows-fragment.sh` 把片段抠出来单独编——而它有个
    # **已实测的局限**：把 placement 的门控错误加回去，它照样报通过
    # （提取出的片段配的是不执行它们的 `fn main() {}`，被 `#[cfg]` 排除的
    # 函数只是消失，没有调用方就没人报错）。所以它证明的是
    # 「这段代码本身能编」，**不是「它在 Windows 上还存在」**。
    # 这个 job 因此仍然是权威判据，不能因为「本地验过了」就删。
    #
    # ⚠️ **`cargo test` 在 Windows 上一次都没跑成过。** 它排在 `cargo check`
    # 后面，而 check 从未通过，所以「Windows 上有多少测试会失败」是**未知数**。
    # 在拿到第一个真实的 Windows 测试结果之前，删掉 `continue-on-error`
    # 只会得到一个立刻全红的门禁。
    #
    # ⚠️ **那 6 个 cfg 作用域问题无法用文本匹配本地检出**：
    # `cleaner.rs::signal`、`webhook.rs::inspect_token`、`skill_files.rs::open_dir`
    # 都有 `#[cfg(not(unix))]` 配对实现（正常写法），与 `placement.rs` 那 4 个
    # **没有**配对实现的，在文本层面几乎同形。
    #
    # 剩下的 36 个 warning 几乎全是 `dead_code`（"is never used"）——
    # 那是 Windows 上大量平台代码编不进来的**必然结果**，不是缺陷。
    # 别为了「让输出干净」去清理或 `#[allow]` 它们：那会把
    # 「这个函数在 Windows 上其实没接」这个信号一起抹掉。
    #
    # 那为什么不让它红着挡人？**一个永远红的徽章会被所有人学会忽略**，
    # 真出事时也没人看它了。这里让它**继续跑、继续报**，但不当门禁——
    # 它现在的作用是「Windows 的状态一眼可见」，不是「挡住了什么」。
    #
    # 端口做完那一步，就是把 `continue-on-error` 删掉。
    # 方向由 `posix_port_ratchet` 守着（每台 macOS 机器的每次 `cargo test` 都跑，
    # 基线 4 处，只减不增）——但它**只覆盖那 6 个 POSIX-only 类**，
    # 上面那 6 个 cfg 作用域问题一条都不在它的表里。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # 本机（macOS）上 `cargo check --target x86_64-pc-windows-msvc` 会在
      # `rusqlite` 的 bundled C 那步就断掉（没有 Windows SDK 头文件，
      # 报 `fatal error: 'stdlib.h' file not found`）。
      # 整 crate 交叉编译因此走不通；但**片段级**验证可以——见
      # `scripts/check-windows-fragment.sh`，它把 `#[cfg(windows)]` 代码
      # 抠到独立 crate 里单独交叉编译。那能抓 unsafe 遗漏与
      # windows-sys 模块路径写错，但**不能替代这个 job**：
      # 它覆盖不到片段之间的交互，也跑不了 `cargo test`。
      - name: 编译检查
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml
      - name: Rust 测试
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
