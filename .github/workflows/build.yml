name: Build

# 为什么有这份 workflow：项目对外承诺「目标平台至少 Windows 和 macOS」，
# 但在此之前**没有任何 CI 在编译这个应用**。后果是 Windows 那条路
# 从写下那天起就没被编译过一次——`#[cfg(windows)]` 的 FFI（取工作区、
# 光标位置、显示器 DPI）长期只存在于源码里，从未被编译器看过一眼。
#
# 这类「看着像实现了、其实从没验证过」的代码，正是本项目反复栽跟头的那一类
# （见 CHANGELOG v0.0.266：发版链三处潜伏缺陷全都藏在「没跑过的代码」里）。
#
# ⚠️ **Windows 这次是真跑测试，不是只做编译。**
# 第一次跑很可能是红的——那就让它红着。CI 的作用是把「我们以为成立」变成
# 「已经验过」，而在此之前 Windows 上的任何结论都只是推断。
# 如果为了让徽章变绿而只做 `cargo check`，那等于造一个假的保证。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      # 可选：仓库变量 AGENTISLAND_SCAN_USER = 开发者本机用户名。
      # 不配时 scripts/scan-secrets.sh 会显式停用 username/local_user_path 两条身份
      # 规则并说明原因——runner 的 $USER 是通用账号名 `runner`，拿它当敏感词会命中
      # 源码里正常的英文词（实测 287 条），整条 macOS job 卡在扫描、后面的门禁与
      # 打包一条都跑不到。配了才会恢复这两条规则的判别力（脚本支持 SCAN_USER 覆盖）。
      SCAN_USER: ${{ vars.AGENTISLAND_SCAN_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: 编译检查
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装签名门禁依赖
        run: python3 -m pip install -r scripts/requirements-test.txt
      - name: 安装锁定的浏览器运行时
        run: |
          npm ci
          npx --no-install playwright install chromium
      - name: 脱敏扫描（工作区）
        # 红线不只在本机守：推送上去的内容必须同样过闸，否则一次绕过本地扫描的
        # 提交就能把密钥送进 git 对象。
        run: bash scripts/scan-secrets.sh
      - name: Rust 测试
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
      - name: 统一源码、浏览器及框架门禁
        run: python3 scripts/automation/pipeline.py --profile ci --check-timeout 1800
      - name: 安装固定版本的 Tauri 打包工具
        run: cargo install tauri-cli --version 2.11.2 --locked
      - name: 构建并验证 ad-hoc 签名包
        # 同轮 ci 已运行 Rust 回归；这里验证真实打包、签名与内容收据。
        #
        # 为什么显式指定 SDK（actions/runner-images#14940，2026-10 起）：
        # macos-latest 当前是 macos-26-arm64 镜像，装了 **CLT 27.0 SDK**，但默认
        # 工具链仍是 Xcode 26.6——Xcode 的 ld 读不了 SDK 27 的 tbd 存根
        # （`unknown architecture arm64e.x1-macos`），任何链接都失败。这不是本仓
        # 代码的问题，也不是 build-app.sh 的选 SDK 逻辑错：它按设计选「本机最新
        # CLT SDK」，在工具链配套的真机上是对的。CI 里改用默认 Xcode 自带 SDK
        # （与 ld 同源）构建；CI 产物不分发，不涉及发布构建对最新 SDK 的要求。
        env:
          SKIP_TESTS: '1'
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "CI 构建 SDK: $SDKROOT"
          case "$SDKROOT" in
            */CommandLineTools/SDKs/MacOSX27*)
              echo "::error::runner 仍解析到 CLT 27 SDK（actions/runner-images#14940），与默认 ld 不配套" >&2
              exit 1
              ;;
          esac
          bash scripts/build-app.sh
      - name: 同包 CLI 与构建身份验收
        run: python3 scripts/automation/pipeline.py --profile package
      - name: 汇总执行结果
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          reports = sorted(Path('.scratch/automation-runs').glob('*/summary.md'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              for report in reports:
                  output.write(report.read_text(encoding='utf-8'))
                  output.write('\n')
          PY
      - name: 保存本轮测试证据（包括失败与未验项）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci-evidence
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .scratch/automation-runs/**/run.json
            .scratch/automation-runs/**/junit.xml
            .scratch/automation-runs/**/summary.md

  windows:
    name: Windows
    runs-on: windows-latest
    # Windows 原生编译与测试作为必过检查；不得排除失败用例来声明通过。
    # macOS 交叉类型检查不覆盖 Winsock/文件锁运行时行为。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # 本机（macOS）上 `cargo check --target x86_64-pc-windows-msvc` 会在
      # `rusqlite` 的 bundled C 那步就断掉（没有 Windows SDK 头文件，
      # 报 `fatal error: 'stdlib.h' file not found`）。
      # 整 crate 交叉编译因此走不通；但**片段级**验证可以——见
      # `scripts/check-windows-fragment.sh`，它把 `#[cfg(windows)]` 代码
      # 抠到独立 crate 里单独交叉编译。那能抓 unsafe 遗漏与
      # windows-sys 模块路径写错，但**不能替代这个 job**：
      # 它覆盖不到片段之间的交互，也跑不了 `cargo test`。
      - name: 编译检查
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml
      - name: HTTP 超时与取消回归
        run: cargo test --manifest-path vendor/tiny_http/Cargo.toml --test timeout-cancel
      - name: Rust 测试
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
