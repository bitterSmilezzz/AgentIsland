[package]
name = "agentisland"
version = "0.1.0"
description = "Agent 会话灵动岛监控器 — 多平台端 (Tauri)"
authors = ["bitterSmilezzz"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tiny_http = "0.12"
walkdir = "2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
