[package]
name = "agentisland"
version = "0.1.0"
description = "Agent 会话灵动岛监控器 — 多平台端 (Tauri)"
authors = ["bitterSmilezzz"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.15"
sysinfo = "0.33"
tiny_http = "0.12"
walkdir = "2"
dirs = "5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 本地时区（静默时段要按用户的钟表判）：lock 里早有这个版本，作为直接依赖不增加构建成本
libc = "0.2"
# 外发要出网：ntfy 与各家 webhook 的默认路径都是 https，SMTP 走 465 隐式 TLS。
# 用系统 TLS 栈（macOS = Security.framework，与 Swift 侧 URLSession/Network.framework 同一套），
# 好处是它同时带进 security-framework —— 下一轮钥匙串正好要用同一个 crate。
native-tls = "0.2"
# SMTP 的 AUTH LOGIN 与 RFC 2047 主题都要 base64；lock 里早有 0.21.7（传递依赖），列为直接依赖不增加下载
base64 = "0.21"
# 钥匙串：密钥只进 macOS 钥匙串（本仓红线）。这个 crate 由 native-tls 已经带进来，
# 列为直接依赖不增加下载；sys 那层是为了两个具名错误码常量，
# 用名字而不是 -25308 这种魔数（与 Swift `RemoteSecret.describe` 同一处文案）。
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
