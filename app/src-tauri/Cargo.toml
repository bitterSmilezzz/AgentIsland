[package]
name = "agentisland"
version = "0.1.0"
description = "Agent 会话灵动岛监控器 — 多平台端 (Tauri)"
authors = ["bitterSmilezzz"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.15"
sysinfo = "0.33"
tiny_http = "0.12"
walkdir = "2"
dirs = "5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 本地时区（静默时段要按用户的钟表判）：lock 里早有这个版本，作为直接依赖不增加构建成本
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
