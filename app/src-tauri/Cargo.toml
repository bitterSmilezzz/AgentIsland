[package]
name = "agentisland"
version = "0.0.290"
description = "Agent 会话灵动岛监控器 — 多平台端 (Tauri)"
authors = ["bitterSmilezzz"]
edition = "2021"
# 真实可用的最低版本。原先写 1.77，但依赖里的 tauri 早已要求远高于此——
# 只是那些 crate 没写 `rust-version`，cargo 才不报。这条声明早就是 fiction，
# 真正的代价是：它挡住了两个官方插件（autostart / global-shortcut 要求 1.90），
# cargo 只好想退到 2.0.0-rc 预发布版。抬到 1.90 让声明与事实一致。
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["v4"] }
# Reuse the URL parser already locked by Tauri; handwritten authority parsing broke IPv6/query URLs.
url = "2"
# Read-only service requests use bounded framing and system TLS, without proxy/redirect/retry defaults.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
toml_edit = "0.25.15"
sysinfo = "0.33"
tiny_http = "0.12"
walkdir = "2"
dirs = "5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 本地时区（静默时段要按用户的钟表判）：lock 里早有这个版本，作为直接依赖不增加构建成本
libc = "0.2"
# 外发要出网：ntfy 与各家 webhook 的默认路径都是 https，SMTP 走 465 隐式 TLS。
# 用系统 TLS 栈（macOS = Security.framework，与 Swift 侧 URLSession/Network.framework 同一套），
# 好处是它同时带进 security-framework —— 下一轮钥匙串正好要用同一个 crate。
native-tls = "0.2"
# SMTP 的 AUTH LOGIN 与 RFC 2047 主题都要 base64；lock 里早有 0.21.7（传递依赖），列为直接依赖不增加下载
base64 = "0.21"
hmac = "0.12"
sha2 = "0.10"
# 钥匙串那两个 crate 是 **macOS 专属**，已挪到下面的
# `[target.'cfg(target_os = "macos")'.dependencies]`。
# 此前它们挂在 `[dependencies]` 里，于是 `core-foundation`（Apple Core Foundation 绑定，
# 内部用 `std::os::unix`）被**无条件**拉进 Windows 的依赖图——首次
# `cargo check --target x86_64-pc-windows-msvc` 直接死在
# `core-foundation-0.10.1/src/filedescriptor.rs: cannot find 'unix' in 'os'`。
# 本仓对它们的 4 处引用全在 `#[cfg(target_os = "macos")]` 模块内，门控无副作用。
# 开机自启（设置项 `launch_at_login`）与全局热键（`global_hot_key_enabled`）。
# Tauri 官方一方插件：这两个能力在 Tauri 核心之外，手写要分别碰
# LaunchAgent / 注册表 与 Carbon / Win32 的 unsafe FFI——用官方插件换掉那份平台代码。
# 二者都要求 rustc 1.90，见上面 `rust-version` 那条注。
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSScreen", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry"] }
# Rust-owned transcript buffers otherwise accumulate in macOS malloc's freed-large cache.
# Keep AppKit/WebKit allocation and the other platforms' allocators unchanged.
mimalloc = { version = "0.1", default-features = false }

# 钥匙串：密钥只进 macOS 钥匙串（本仓红线）。`security-framework` 由 `native-tls`
# 已经带进来，列为直接依赖不增加下载；`security-framework-sys` 那层是为了两个
# 具名错误码常量，用名字而不是 -25308 这种魔数（与 Swift `RemoteSecret.describe`
# 同一处文案）。
#
# ⚠️ **必须按 target 门控。** `core-foundation` 内部 `use std::os::unix::…`，
# 挂在 `[dependencies]` 里会让整个 Windows 构建在**依赖阶段**就编不过——
# 错误发生在 `core-foundation` 自己身上，不在本仓任何一行，所以本机（macOS）
# 永远看不见。判据用 `cargo tree --target x86_64-pc-windows-msvc -i core-foundation`。
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
